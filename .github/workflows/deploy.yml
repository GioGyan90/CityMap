name: Build and deploy city map
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: citymap-vite-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Wait for legacy branch publishing to finish
        uses: actions/github-script@v7
        with:
          script: |
            // The legacy publisher must finish first, but must never share
            // this workflow's concurrency group. Query individual runs:
            // collection responses can retain an earlier queued status.
            const headers = { 'cache-control': 'no-cache' };
            const owner = context.repo.owner, repo = context.repo.repo;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, head_sha: context.sha, per_page: 100, headers }
            );
            const legacy = runs.filter(run =>
              run.name === 'pages build and deployment' &&
              run.event === 'dynamic' && run.head_sha === context.sha
            );
            core.info('Legacy publisher IDs: ' + legacy.map(run => run.id).join(', '));
            if (!legacy.length) {
              core.info('No legacy publisher for this commit; deploying compiled app.');
              return;
            }
            for (let attempt = 0; attempt < 180; attempt++) {
              const states = await Promise.all(legacy.map(async run => {
                const { data } = await github.rest.actions.getWorkflowRun({
                  owner, repo, run_id: run.id, headers
                });
                return data;
              }));
              core.info(states.map(run =>
                run.id + ': ' + run.status + ' / ' + run.conclusion
              ).join('; '));
              if (states.every(run => run.status === 'completed')) return;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Legacy publisher still active after 15 minutes; see run IDs above.');
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
