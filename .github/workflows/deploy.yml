name: Build and deploy city map
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for legacy branch publishing to finish
        uses: actions/github-script@v7
        with:
          script: |
            // Branch-based Pages and this Vite workflow can run for the same push.
            // Always publish the compiled app last, after the legacy run finishes.
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                head_sha: context.sha, per_page: 30
              });
              const legacy = data.workflow_runs.find(run =>
                run.name === 'pages build and deployment' && run.event === 'dynamic');
              if (legacy?.status === 'completed' || (!legacy && attempt >= 3)) return;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Legacy Pages publishing did not finish within five minutes.');
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
