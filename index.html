<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>海岸城 · Lucky Break 3D 地图</title></head><body>
<div id="app"></div>

<div class="hud">
  <h1>海岸城 · COASTAL CITY</h1>
  <p>拖拽旋转 · 滚轮缩放 · 悬停地标聚焦 / 手机轻点</p>
</div>

<div class="toolbar">
  <button data-view="hero">海岸全景</button>
  <button data-view="top">俯视地图</button>
  <button data-view="skyline">城市天际线</button>
  <button data-view="parking">办公停车场</button>
  <button data-view="traffic">路口交通</button>
  <button data-view="crossing">电车道口</button>
  <button data-view="residential">山麓别墅</button>
  <button data-view="station">山麓车站</button>
  <button data-view="lighthouse">海岬灯塔</button>
  <button data-view="park">游乐园</button>
  <button data-view="port">码头市场</button>
  <button data-view="cargo">货运码头</button>
  <button data-view="passenger">邮轮客运码头</button>
  <button data-view="cruise">豪华邮轮</button>
  <button data-view="civic">政府广场</button>
  <button data-view="hospital">医院</button>
<button data-view="hotel">高档酒店</button>
<button data-view="market">台球用品市场</button>
<button data-view="hall1">炽焰 · 红馆</button>
<button data-view="fishmarket">码头鱼市</button>
<button data-view="hall2">常青 · 绿馆</button>
<button data-view="hall3">蓝序 · 蓝馆</button>
<button data-view="hall4">白弧 · 白馆</button>
<button data-view="hall5">黑铆 · 黑馆</button>
<button data-view="cafe">咖啡馆</button>
<button data-view="restaurant">海鲜餐厅</button>
<button data-view="promenade">海滨长廊餐厅</button>
<button id="toggleNight" aria-pressed="false">夜间模式</button>
<button id="toggleMotion" aria-pressed="false">暂停动画</button>
<button id="toggleLabels" aria-pressed="true">隐藏地名</button>
</div>

<div class="legend">
  <span>🎡 游乐园</span><span>🏛 政府大厅</span><span>🏥 医院</span><span>🏨 高档酒店</span>
  <span>⚓ 码头市场</span><span>🍴 餐厅</span><span>☕ 咖啡馆</span><span>🧺 市场</span>
</div>

<div id="loading" role="status">正在建造海岸城…</div><script type="module" src="/src/main.ts"></script></body></html>
